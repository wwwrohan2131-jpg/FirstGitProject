
<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .login-btn {
            background-color: #2563eb;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Create User</h1>

        <input
            type="text"
            id="username"
            placeholder="Enter your username"
        >

        <button onclick="createUser()">
            Create User
        </button>

        <br><br>

        <button class="login-btn" onclick="window.location.href='login.html'">
            Login
        </button>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
